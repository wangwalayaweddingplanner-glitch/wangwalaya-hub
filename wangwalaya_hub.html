<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wang Walaya — System Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&family=Sarabun:wght@400;500;600&display=swap&subset=thai,latin" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #F9F5EF; --warm-white: #FDFAF6;
  --gold: #C4A96B; --gold-light: #E8D5A3; --gold-dark: #8B6F3A;
  --text: #2A1F14; --text-mid: #6B5A47; --text-light: #A89880;
  --border: rgba(196,169,107,0.25); --border-strong: rgba(196,169,107,0.5);
  --shadow: 0 4px 32px rgba(42,31,20,0.08);
  --green: #4a7c59; --green-bg: #eef4f0;
  --orange: #b8621a; --orange-bg: #fdf0e6;
  --blue: #2563a8; --blue-bg: #eef3fb;
}
html, body { min-height: 100vh; background: var(--cream); font-family: 'Sarabun', 'DM Sans', sans-serif; color: var(--text); }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 60% 40% at 80% 10%, rgba(196,169,107,0.08) 0%, transparent 60%), radial-gradient(ellipse 50% 60% at 10% 90%, rgba(196,169,107,0.06) 0%, transparent 60%); pointer-events: none; z-index: 0; }

.screen { display: none; position: relative; z-index: 1; min-height: 100vh; animation: fadeIn 0.45s ease; }
.screen.active { display: block; }
#login-screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }

/* LOGIN */
.logo-wrap { text-align: center; margin-bottom: 3rem; }
.logo-ornament { display: block; margin: 0 auto 1.2rem; width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); position: relative; }
.logo-ornament::before, .logo-ornament::after { content: '✦'; position: absolute; top: -7px; font-size: 10px; color: var(--gold); }
.logo-ornament::before { left: -14px; } .logo-ornament::after { right: -14px; }
.logo-title { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500; letter-spacing: 0.12em; color: var(--text); }
.logo-sub { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-light); margin-top: 10px; font-weight: 300; }
.login-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; padding: 2.5rem 2.75rem; width: 100%; max-width: 400px; box-shadow: var(--shadow); }
.login-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; color: var(--text-mid); text-align: center; margin-bottom: 2rem; letter-spacing: 0.05em; }
.field { margin-bottom: 1.25rem; }
.field label { display: block; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-light); margin-bottom: 7px; }
.field input { width: 100%; padding: 11px 14px; background: var(--cream); border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
.field input:focus { border-color: var(--gold); }
.field input::placeholder { color: var(--text-light); }
.btn-login { width: 100%; padding: 12px; background: var(--text); color: var(--cream); border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
.btn-login:hover { background: var(--gold-dark); }
.err-msg { font-size: 12px; color: #b85c5c; text-align: center; margin-top: 10px; min-height: 18px; }

/* NAV */
.nav { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 2.5rem; border-bottom: 1px solid var(--border); background: rgba(253,250,246,0.92); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100; }
.nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 500; letter-spacing: 0.1em; color: var(--text); cursor: pointer; }
.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-user { font-size: 12px; color: var(--text-light); }
.btn-ghost { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-mid); background: none; border: 1px solid var(--border); border-radius: 2px; padding: 6px 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
.btn-ghost:hover { border-color: var(--gold); color: var(--gold-dark); }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-light); }
.breadcrumb .sep { color: var(--border-strong); }
.breadcrumb .crumb-link { cursor: pointer; transition: color 0.15s; }
.breadcrumb .crumb-link:hover { color: var(--gold-dark); }
.breadcrumb .current { color: var(--text); font-weight: 500; }

/* CONTENT */
.content { padding: 2.5rem; max-width: 900px; margin: 0 auto; }
.section-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); font-weight: 500; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 12px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
.divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 2rem 0; }

/* HOME */
.home-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 12px; flex-wrap: wrap; }
.page-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 500; letter-spacing: 0.04em; }
.btn-new { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--text); color: var(--cream); border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; cursor: pointer; text-decoration: none; transition: background 0.2s; }
.btn-new:hover { background: var(--gold-dark); }
.btn-new svg { width: 14px; height: 14px; }

/* JOB CARDS */
.jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.job-card { background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; padding: 1.4rem 1.5rem; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; position: relative; overflow: hidden; }
.job-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--gold); opacity: 0; transition: opacity 0.2s; }
.job-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); transform: translateY(-2px); }
.job-card:hover::before { opacity: 1; }
.job-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.job-name { font-family: 'Sarabun', sans-serif !important; font-weight: 500 !important; font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.3; }
.job-status { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.status-active { background: var(--green-bg); color: var(--green); }
.status-pending { background: var(--orange-bg); color: var(--orange); }
.status-new { background: var(--blue-bg); color: var(--blue); }
.job-meta { font-size: 12px; color: var(--text-light); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.job-meta svg { width: 12px; height: 12px; flex-shrink: 0; }
.progress-wrap { margin-top: 12px; }
.progress-labels { font-size: 11px; color: var(--text-light); display: flex; justify-content: space-between; margin-bottom: 6px; }
.progress-bar { height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-dark), var(--gold)); border-radius: 2px; }

/* QUICK LINKS */
.quick-row { display: flex; flex-wrap: wrap; gap: 10px; }
.quick-btn { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--warm-white); border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text-mid); text-decoration: none; cursor: pointer; transition: all 0.2s; }
.quick-btn:hover { border-color: var(--gold); color: var(--gold-dark); }
.quick-btn svg { width: 13px; height: 13px; opacity: 0.7; flex-shrink: 0; }

/* JOB DETAIL HEADER */
.job-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 16px; }
.job-header-title { font-family: 'Sarabun', sans-serif; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.job-header-meta { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.job-header-meta-item { font-size: 13px; color: var(--text-light); display: flex; align-items: center; gap: 5px; }
.job-header-meta-item svg { width: 13px; height: 13px; }

/* ACCORDION STEPS — matching the screenshot style */
.steps-list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.step-row { border-bottom: 1px solid var(--border); background: var(--warm-white); }
.step-row:last-child { border-bottom: none; }

.step-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; user-select: none; transition: background 0.15s; }
.step-header:hover { background: var(--cream); }
.step-check { width: 18px; height: 18px; border: 2px solid var(--border-strong); border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; background: white; }
.step-check.checked { background: var(--gold); border-color: var(--gold); }
.step-check svg { width: 11px; height: 11px; color: white; display: none; }
.step-check.checked svg { display: block; }
.step-header-title { font-size: 15px; font-weight: 500; color: var(--text); flex: 1; }
.step-header-title.done-title { color: var(--text-light); text-decoration: line-through; }
.step-chevron { color: var(--text-light); transition: transform 0.25s; flex-shrink: 0; }
.step-chevron svg { width: 14px; height: 14px; }
.step-row.open .step-chevron { transform: rotate(180deg); }

.step-body { display: none; padding: 0 18px 18px 48px; background: var(--warm-white); }
.step-row.open .step-body { display: block; }

/* Note textarea */
.note-area { width: 100%; min-height: 80px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: white; resize: vertical; outline: none; transition: border-color 0.2s; }
.note-area:focus { border-color: var(--gold); }
.note-area::placeholder { color: var(--text-light); }
.save-row { display: flex; justify-content: flex-end; margin-top: 8px; }
.btn-save { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; background: var(--gold); color: var(--warm-white); border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
.btn-save:hover { background: var(--gold-dark); }
.btn-save svg { width: 12px; height: 12px; }

/* Link row */
.link-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.link-label { font-size: 12px; color: var(--text-light); white-space: nowrap; }
.link-input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--cream); outline: none; transition: border-color 0.2s; }
.link-input:focus { border-color: var(--gold); }
.link-input::placeholder { color: var(--text-light); }
.btn-open { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; background: var(--cream); color: var(--text-mid); border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.btn-open:hover { border-color: var(--gold); color: var(--gold-dark); }
.btn-open svg { width: 12px; height: 12px; }

/* External link button */
.btn-ext { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--text); color: var(--cream); border: none; border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; text-decoration: none; cursor: pointer; transition: background 0.2s; margin-top: 12px; }
.btn-ext:hover { background: var(--gold-dark); }
.btn-ext svg { width: 12px; height: 12px; }

/* Team list (step 05) */
.team-list { margin-top: 12px; display: flex; flex-direction: column; gap: 0; border: 1px solid var(--border); border-radius: 2px; overflow: hidden; }
.team-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--border); background: white; }
.team-row:last-child { border-bottom: none; }
.team-check { width: 16px; height: 16px; border: 2px solid var(--border-strong); border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; background: white; }
.team-check.checked { background: var(--blue); border-color: var(--blue); }
.team-check svg { width: 10px; height: 10px; color: white; display: none; }
.team-check.checked svg { display: block; }
.team-name { font-size: 13px; font-weight: 500; color: var(--text); min-width: 130px; }
.team-detail { flex: 1; font-size: 13px; color: var(--text-light); border: none; background: transparent; font-family: 'DM Sans', sans-serif; outline: none; }
.team-detail::placeholder { color: var(--text-light); }
.team-remove { color: var(--text-light); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px; transition: color 0.15s; }
.team-remove:hover { color: #b85c5c; }
.btn-add-team { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 7px 14px; background: none; color: var(--gold-dark); border: 1px dashed var(--gold); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.btn-add-team:hover { background: rgba(196,169,107,0.08); }

/* Appointment block */
.appt-block { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
.appt-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-light); margin-bottom: 8px; }
.appt-saved { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--cream); border: 1px solid var(--border); border-radius: 2px; margin-bottom: 10px; }
.appt-saved-icon { color: var(--gold); flex-shrink: 0; }
.appt-saved-icon svg { width: 14px; height: 14px; }
.appt-saved-text { flex: 1; }
.appt-saved-date { font-size: 13px; font-weight: 500; color: var(--text); }
.appt-saved-note { font-size: 12px; color: var(--text-light); margin-top: 2px; }
.appt-saved-actions { display: flex; gap: 6px; }
.btn-appt-edit { font-size: 11px; color: var(--text-light); background: none; border: 1px solid var(--border); border-radius: 2px; padding: 4px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
.btn-appt-edit:hover { border-color: var(--gold); color: var(--gold-dark); }
.btn-appt-del { font-size: 11px; color: #b85c5c; background: none; border: 1px solid rgba(184,92,92,0.3); border-radius: 2px; padding: 4px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
.btn-gcal { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #1a73e8; background: #e8f0fe; border: 1px solid #c5d6f7; border-radius: 2px; padding: 4px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; text-decoration: none; transition: all 0.2s; white-space: nowrap; }
.btn-gcal:hover { background: #d2e3fc; border-color: #a8c0f0; }
.appt-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.appt-form-group { display: flex; flex-direction: column; gap: 4px; }
.appt-form-group label { font-size: 11px; color: var(--text-light); }
.appt-input-date { padding: 8px 10px; border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: white; outline: none; }
.appt-input-date:focus { border-color: var(--gold); }
.appt-input-note { padding: 8px 10px; border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: white; outline: none; width: 200px; }
.appt-input-note:focus { border-color: var(--gold); }
.appt-input-note::placeholder { color: var(--text-light); }
.btn-appt-add { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; background: none; color: var(--gold-dark); border: 1px dashed var(--gold); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.btn-appt-add:hover { background: rgba(196,169,107,0.08); }

/* Quotation list */
.quote-list { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
.quote-list-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-light); margin-bottom: 8px; }
.quote-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--cream); border: 1px solid var(--border); border-radius: 2px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.2s; text-decoration: none; }
.quote-item:hover { border-color: var(--gold); }
.quote-item-icon { color: var(--gold); flex-shrink: 0; }
.quote-item-icon svg { width: 14px; height: 14px; }
.quote-item-num { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; }
.quote-item-date { font-size: 12px; color: var(--text-light); }
.quote-item-arrow { color: var(--text-light); }
.quote-item-arrow svg { width: 13px; height: 13px; }
.quote-add-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.quote-num-input { padding: 8px 10px; border: 1px solid var(--border); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: white; outline: none; width: 180px; }
.quote-num-input:focus { border-color: var(--gold); }
.quote-num-input::placeholder { color: var(--text-light); }
.btn-quote-add { display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px; background: none; color: var(--gold-dark); border: 1px dashed var(--gold); border-radius: 2px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.btn-quote-add:hover { background: rgba(196,169,107,0.08); }

/* TOAST */
#toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--cream); font-size: 13px; padding: 10px 22px; border-radius: 2px; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; white-space: nowrap; z-index: 9999; font-family: 'DM Sans', sans-serif; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 640px) {
  .content { padding: 1.5rem 1rem; }
  .nav { padding: 1rem; }
  .login-card { padding: 2rem 1.5rem; }
  .jobs-grid { grid-template-columns: 1fr; }
  .logo-title { font-size: 30px; }
}

/* ── Template Message Modal ── */
.tpl-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; }
.tpl-modal { background:var(--surface); border-radius:12px; width:100%; max-width:540px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.25); }
.tpl-modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 12px; border-bottom:1px solid var(--border); }
.tpl-modal-title { font-size:15px; font-weight:600; color:var(--text); }
.tpl-modal-close { background:none; border:none; cursor:pointer; color:var(--text-light); font-size:20px; padding:0 4px; line-height:1; }
.tpl-modal-close:hover { color:var(--text); }
.tpl-tabs { display:flex; gap:4px; padding:12px 20px 0; flex-wrap:wrap; }
.tpl-tab { font-size:12px; padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:none; color:var(--text-light); cursor:pointer; font-family:inherit; transition:all 0.15s; }
.tpl-tab.active { background:var(--gold); color:white; border-color:var(--gold); font-weight:500; }
.tpl-tab:hover:not(.active) { border-color:var(--gold); color:var(--gold-dark); }
.tpl-body { padding:16px 20px; flex:1; overflow-y:auto; }
.tpl-preview { background:#f7f5f0; border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-size:13px; line-height:1.75; color:var(--text); white-space:pre-wrap; word-break:break-word; min-height:180px; font-family:'Sarabun', 'DM Sans', sans-serif; }
.tpl-actions { display:flex; gap:8px; padding:12px 20px 16px; border-top:1px solid var(--border); }
.btn-copy-tpl { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px; background:var(--gold); color:white; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; transition:all 0.15s; }
.btn-copy-tpl:hover { background:var(--gold-dark); }
.btn-copy-tpl.copied { background:#4caf50; }
.tpl-label { font-size:11px; color:var(--text-light); margin-bottom:8px; letter-spacing:0.06em; text-transform:uppercase; }
.btn-tpl-msg { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--text-light); background:none; border:1px solid var(--border); border-radius:2px; padding:4px 10px; cursor:pointer; font-family:'DM Sans', sans-serif; transition:all 0.2s; }
.btn-tpl-msg:hover { border-color:var(--gold); color:var(--gold-dark); }


* { font-variant-ligatures: none; }
.job-name, .job-header-title { font-family: 'Sarabun', sans-serif !important; }

@font-face {

<script>
const USERS = { 'nan': 'wangwalaya', 'admin': 'admin123' };
let currentUser = '';
let currentJobId = null;

// ── Firebase Init ──
const firebaseConfig = {
  apiKey: "AIzaSyASqcu4d7IVSZApiZkkkjq-hn09U5kpN7w",
  authDomain: "deposit-wangwalaya.firebaseapp.com",
  databaseURL: "https://deposit-wangwalaya-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "deposit-wangwalaya",
  storageBucket: "deposit-wangwalaya.firebasestorage.app",
  messagingSenderId: "247291365395",
  appId: "1:247291365395:web:520903fdb0017d77c2d7e6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── Jobs data (loaded from Firebase ww_jobs) ──
let jobs = [];

// ── Hub data per job ──
const jobDataCache = {};

function getJobData(jobId) {
  if (!jobDataCache[jobId]) {
    jobDataCache[jobId] = {
      notes: { venue:'', idea:'', design:'', ceremony:'', finalcall:'' },
      links: { venue:'' },
      stepDone: {},
      appointments: { venue:[], ceremony:[], finalcall:[] },
      quotations: [],
      teamList: [
        { name:'ช่างปัก', detail:'', done:false },
        { name:'ทีมรันคิว', detail:'', done:false },
        { name:'ระบบไฟแสงสีเสียง', detail:'', done:false },
        { name:'พิธีกร', detail:'', done:false },
      ]
    };
  }
  return jobDataCache[jobId];
}

function saveHubData(jobId) {
  if (!jobId) return;
  const d = jobDataCache[jobId];
  if (!d) return;
  db.ref('ww_hub_data/' + jobId).set(JSON.parse(JSON.stringify(d)))
    .catch(e => console.warn('Save error:', e));
}

function loadHubData(jobId, callback) {
  db.ref('ww_hub_data/' + jobId).once('value').then(snap => {
    const val = snap.val();
    if (val) {
      const def = getJobData(jobId);
      jobDataCache[jobId] = {
        notes: Object.assign({}, def.notes, val.notes || {}),
        links: Object.assign({}, def.links, val.links || {}),
        stepDone: Object.assign({}, val.stepDone || {}),
        appointments: {
          venue: val.appointments && val.appointments.venue ? Object.values(val.appointments.venue) : [],
          ceremony: val.appointments && val.appointments.ceremony ? Object.values(val.appointments.ceremony) : [],
          finalcall: val.appointments && val.appointments.finalcall ? Object.values(val.appointments.finalcall) : [],
        },
        quotations: val.quotations ? Object.values(val.quotations) : [],
        teamList: val.teamList ? Object.values(val.teamList) : def.teamList,
      };
    }
    if (callback) callback();
  }).catch(e => { console.warn('Load error:', e); if (callback) callback(); });
}

function loadJobsFromFirebase(callback) {
  db.ref('ww_jobs').once('value').then(snap => {
    const val = snap.val();
    if (val) {
      const months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
      function toThaiDate(iso) {
        if (!iso) return '—';
        const [y,m,d] = iso.split('-');
        return parseInt(d)+' '+months[parseInt(m)]+' '+(parseInt(y)+543);
      }
      function inferStatus(j) {
        const steps = j.steps || {};
        const done = Object.values(steps).filter(s => s && s.done).length;
        if (done === 0) return 'new';
        if (done >= 6) return 'done';
        return 'active';
      }
      function calcProgress(steps) {
        const keys = ['site','idea','team','quote','design','summary','ceremony','final','account'];
        return Math.min(keys.filter(k => steps[k] && steps[k].done).length + 1, 10);
      }
      jobs = Object.values(val).map(j => {
        // Extract nickname from parentheses e.g. "วิไลภรณ์ ภูกองชัย (Wilaiporn)" → "วิไลภรณ์"
        // or "สิริมนต์ พันธุ์จันทร์ดี (แบม)" → "คุณแบม"
        function getNickname(str) {
          if (!str) return '';
          return str.trim(); // use full name as-is from Firebase
        }
        const brideNick = getNickname(j.bride);
        const groomNick = getNickname(j.groom);
        const displayName = [groomNick, brideNick].filter(Boolean).join(' & ') || j.bride || j.id;
        return {
        id: j.id,
        name: displayName,
        fullName: [j.groom, j.bride].filter(Boolean).join(' & ') || j.bride || '',
        date: toThaiDate(j.eventdate),
        venue: j.venue || '—',
        status: inferStatus(j),
        progress: calcProgress(j.steps || {}),
        docno: j.docno || '',
        budget: j.budget || '—',
        tel: j.tel || '—',
        times: j.times || [],
        style: j.style || '',
        ceremonies: j.ceremonies || [],
        guests: j.guests ? parseInt(j.guests) : null,
        dep1: j.dep1||'', dep2: j.dep2||'', dep3: j.dep3||'',
      };}).sort((a,b) => {
        const fa = val[a.id] && val[a.id].eventdate ? new Date(val[a.id].eventdate) : new Date('9999');
        const fb = val[b.id] && val[b.id].eventdate ? new Date(val[b.id].eventdate) : new Date('9999');
        return fa - fb;
      });
    }
    if (callback) callback();
  }).catch(e => { console.warn('Firebase jobs error:', e); if (callback) callback(); });
}


// AUTH
function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if (USERS[u] && USERS[u] === p) {
    currentUser = u;
    document.getElementById('nav-user').textContent = u + '.wangwalaya';
    document.getElementById('nav-user2').textContent = u + '.wangwalaya';
    document.getElementById('err-msg').textContent = '';
    showScreen('home-screen');
    // Show loading while fetching from Firebase
    document.getElementById('jobs-grid').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);font-size:14px;">⏳ กำลังโหลดข้อมูล...</div>';
    loadJobsFromFirebase(function() {
      renderJobs();
    });
  } else {
    document.getElementById('err-msg').textContent = 'Username หรือ Password ไม่ถูกต้อง';
  }
}
function doLogout() {
  currentUser = ''; currentJobId = null;
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  showScreen('login-screen');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').classList.contains('active')) doLogin();
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function goHome() { showScreen('home-screen'); }

// RENDER JOBS
const statusClass = { new: 'status-new', active: 'status-active', done: 'status-done', pending: 'status-pending' };
const statusLabel = { new: 'งานใหม่', active: 'กำลังดำเนินการ', done: 'เสร็จแล้ว', pending: 'รอดำเนินการ' };

function renderJobs() {
  const grid = document.getElementById('jobs-grid');
  grid.innerHTML = jobs.map(j => {
    const pct = Math.round(((j.progress - 1) / 9) * 100);
    return `<div class="job-card" onclick="openJob('${j.id}')">
      <div class="job-card-top">
        <div class="job-name">${j.name}</div>
        <span class="job-status ${statusClass[j.status]}">${statusLabel[j.status]}</span>
      </div>
      <div class="job-meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${j.date}</div>
      <div class="job-meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${j.venue}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;">${j.docno} &nbsp;·&nbsp; งบ ${j.budget}</div>
      <div class="progress-wrap">
        <div class="progress-labels"><span>ความคืบหน้า</span><span>ขั้นตอน ${j.progress}/10</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

// OPEN JOB
function openJob(id) {
  const job = jobs.find(j => j.id === id);
  if (!job) return;
  currentJobId = id;
  document.getElementById('bc-name').textContent = job.name;
  document.getElementById('detail-name').textContent = job.fullName || job.name;
  document.getElementById('detail-date').textContent = job.date;
  document.getElementById('detail-venue').textContent = job.venue;
  document.getElementById('detail-status-badge').innerHTML =
    `<span class="job-status ${statusClass[job.status]}" style="font-size:11px;padding:5px 12px;">${statusLabel[job.status]}</span>` +
    `<span style="margin-left:8px;font-size:11px;color:var(--text-muted);">${job.docno}</span>`;
  // Add booking doc link
  const docLink = document.getElementById('detail-doc-link');
  if (docLink) {
    docLink.href = `https://wangwalaya.netlify.app/job/${id}`;
  }

  // Show extra info row
  const extra = document.getElementById('detail-extra');
  if (extra) {
    const cer = (job.ceremonies||[]).join(', ') || '—';
    const times = (job.times||[]).join(', ') || '—';
    extra.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--text-muted);margin-top:8px;">
        <div>📞 ${job.tel||'—'}</div>
        <div>💰 ${job.budget||'—'}</div>
        <div>👥 ${job.guests ? job.guests+' คน' : '—'}</div>
        <div>⏰ ${times}</div>
        ${job.style ? `<div style="grid-column:1/-1;">🎨 ${job.style}</div>` : ''}
        <div style="grid-column:1/-1;">🎊 ${cer}</div>
        <div>มัดจำ 1: ${job.dep1||'—'}</div>
        <div>มัดจำ 2: ${job.dep2||'—'}</div>
      </div>`;
  }
  // Load hub data from Firebase then render
  showScreen('detail-screen');
  document.getElementById('steps-list').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-light);font-size:13px;">⏳ กำลังโหลด...</div>';
  loadHubData(id, function() {
    renderSteps(id);
  });
}

const checkSVG = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1.5,6 4.5,9 10.5,3"/></svg>`;
const chevSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>`;
const saveSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`;
const extSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

function renderSteps(jobId) {
  const d = getJobData(jobId);
  const list = document.getElementById('steps-list');

  const steps = [
    { key: 'venue', num:'03', label:'ดูสถานที่จัดงาน', type:'venue' },
    { key: 'idea',  num:'04', label:'สรุปไอเดีย',      type:'note' },
    { key: 'team',  num:'05', label:'จองทีม',           type:'team' },
    { key: 'quote', num:'06', label:'ออกใบเสนอราคา',   type:'quote', href:'https://wangwalayaweddingplanner-glitch.github.io/wang-walaya-quotation/wang_walaya_quotation.html', btnLabel:'สร้างใบเสนอราคา' },
    { key: 'design',    num:'07', label:'ออกแบบ – ส่งแบบ 2D',   type:'note' },
    { key: 'ceremony',  num:'08', label:'สรุปพิธีการ',            type:'note-appt' },
    { key: 'finalcall', num:'09', label:'Final Call',             type:'note-appt' },
    { key: 'finance',   num:'10', label:'บัญชีรายรับ – รายจ่าย', type:'ext', href:'https://wangwalaya-finance.netlify.app/', btnLabel:'เปิดระบบ Finance' },
  ];

  list.innerHTML = steps.map(s => {
    const isDone = !!d.stepDone[s.key];
    let body = '';
    if (s.type === 'venue') {
      body = `
        <textarea class="note-area" id="note-${s.key}" placeholder="จดโน้ต..." onchange="saveNote('${s.key}')">${d.notes[s.key]||''}</textarea>
        <div class="save-row"><button class="btn-save" onclick="saveNote('${s.key}')">${saveSVG} บันทึก</button></div>
        <div class="link-row">
          <span class="link-label">ลิงค์โฟลเดอร์รูปสถานที่:</span>
          <input class="link-input" id="link-venue" type="text" placeholder="https://drive.google.com/..." value="${d.links.venue||''}" onchange="saveLink('venue')" />
          <button class="btn-open" onclick="openLink('venue')">${extSVG} เปิด</button>
        </div>
        <div class="appt-block">
          <div class="appt-label">นัดหมายดูสถานที่</div>
          <div id="appts-venue"></div>
          <div class="appt-form" id="apptform-venue">
            <div class="appt-form-group"><label>วันที่นัด</label><input type="datetime-local" class="appt-input-date" id="apptdate-venue" /></div>
            <div class="appt-form-group"><label>หมายเหตุ</label><input type="text" class="appt-input-note" id="apptnote-venue" placeholder="รายละเอียดนัดหมาย..." /></div>
            <button class="btn-appt-add" onclick="addAppt('venue')">+ เพิ่มนัดหมาย</button>
          </div>
        </div>`;
    } else if (s.type === 'note') {
      body = `
        <textarea class="note-area" id="note-${s.key}" placeholder="จดโน้ต..." onchange="saveNote('${s.key}')">${d.notes[s.key]||''}</textarea>
        <div class="save-row"><button class="btn-save" onclick="saveNote('${s.key}')">${saveSVG} บันทึก</button></div>`;
    } else if (s.type === 'note-appt') {
      body = `
        <textarea class="note-area" id="note-${s.key}" placeholder="จดโน้ต..." onchange="saveNote('${s.key}')">${d.notes[s.key]||''}</textarea>
        <div class="save-row"><button class="btn-save" onclick="saveNote('${s.key}')">${saveSVG} บันทึก</button></div>
        <div class="appt-block">
          <div class="appt-label">นัดหมาย</div>
          <div id="appts-${s.key}"></div>
          <div class="appt-form" id="apptform-${s.key}">
            <div class="appt-form-group"><label>วันที่นัด</label><input type="datetime-local" class="appt-input-date" id="apptdate-${s.key}" /></div>
            <div class="appt-form-group"><label>หมายเหตุ</label><input type="text" class="appt-input-note" id="apptnote-${s.key}" placeholder="รายละเอียดนัดหมาย..." /></div>
            <button class="btn-appt-add" onclick="addAppt('${s.key}')">+ เพิ่มนัดหมาย</button>
          </div>
        </div>`;
    } else if (s.type === 'team') {
      body = `
        <textarea class="note-area" id="note-${s.key}" placeholder="จดโน้ต..." onchange="saveNote('${s.key}')">${d.notes.team||''}</textarea>
        <div class="save-row"><button class="btn-save" onclick="saveNote('${s.key}')">${saveSVG} บันทึก</button></div>
        <div class="team-list" id="team-list"></div>
        <button class="btn-add-team" onclick="addTeam()">+ เพิ่มทีม</button>`;

      body = `
        <a class="btn-ext" href="${s.href}" target="_blank">${extSVG} ${s.btnLabel}</a>
        <div class="quote-list">

/* ── Google Calendar ── */
function buildGCalUrl(title, datetimeStr, durMin, loc, note) {
  if (!datetimeStr) return null;
  const dt = new Date(datetimeStr);
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const end = new Date(dt.getTime() + (durMin||90) * 60000);
  const desc = [loc ? 'สถานที่: ' + loc : '', note ? 'หมายเหตุ: ' + note : ''].filter(Boolean).join('\n');
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: title,
    dates: fmt(dt) + '/' + fmt(end),
    location: loc || '',
    details: desc,
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

function thDateFromISO(iso) {
  if (!iso) return '(ยังไม่ระบุ)';
  const d = new Date(iso);
  const months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  return d.getDate() + ' ' + months[d.getMonth()+1] + ' ' + (d.getFullYear()+543) + ' (วัน' + thDays[d.getDay()] + ')';
}
function thTimeFromISO(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ' น.';
}
function shiftISO(iso, ms) {
  const d = new Date(new Date(iso).getTime() + ms);
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
